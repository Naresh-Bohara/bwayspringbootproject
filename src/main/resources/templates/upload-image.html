<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Upload</title>
<style>
.error {
	color: red
}

.success {
	color: green
}
</style>
</head>
<body>
	<th:block th:insert="header.html"></th:block>
	<div class="container-fluid">
		<div class="card">
			<div class="card-header bg-primary text-center text-white">
				<h4>Upload</h4>
			</div>
			<div class="card-body ">
				<form action="/upload" method="post" enctype="multipart/form-data">
					<div class="row p-2">
						<div class="col-4">Select Image</div>
						<div class="col-6">
							<input type="file" name="image" class="form-control">
						</div>
					</div>

					<div class="row p-2">
						<div class="col-4"></div>
						<div class="col-6">

							<input type="submit" value="Upload"
								class="btn btn-success btn-lg">
						</div>
					</div>
				</form>
				<div th:if="${msg}" class="alert alert-success mt-3">
					<span th:text="${msg}"></span>
				</div>

				<div th:if="${error}" class="alert alert-danger mt-3">
					<span th:text="${error}"></span>
				</div>
			</div>
			<div class="card-footer bg-warning text-center">@copyright2026</div>
		</div>
	</div>
</body>
</html>
