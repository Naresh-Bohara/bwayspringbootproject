<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SignUp</title>

<!-- Font Icon -->
<link rel="stylesheet"
	href="fonts/material-icon/css/material-design-iconic-font.min.css">
<!-- Main css -->
<link rel="stylesheet" href="css/style.css">
<style>
.error {
	color: red;
	margin-bottom: 20px;
}
</style>
</head>
<body>
	<!-- Sign up form -->
	<section class="signup">
		<div class="container">
			<div class="signup-content">
				<div class="signup-form">
					<h2 class="form-title">Sign up</h2>
					<form method="POST" action="/signup" class="register-form"
						id="register-form">
						<p class="error">
							[[${error}]] <br>
						</p>
						<div class="form-group">
							<label for="fname"><i
								class="zmdi zmdi-account material-icons-name"></i></label> <input
								type="text" name="fname" id="fname"
								placeholder="Your First Name" />
						</div>

						<div class="form-group">
							<label for="lname"><i
								class="zmdi zmdi-account material-icons-name"></i></label> <input
								type="text" name="lname" id="lname" placeholder="Your Last Name" />
						</div>
						<div class="form-group">
							<label for="username"><i
								class="zmdi zmdi-account material-icons-name"></i></label> <input
								type="text" name="username" id="username"
								placeholder="Your UserName" />
						</div>

						<div class="form-group">
							<label for="pass"><i class="zmdi zmdi-lock"></i></label> <input
								type="password" name="password" id="pass" placeholder="Password" />
						</div>
						<div class="form-group">
							<label for="re-pass"><i class="zmdi zmdi-lock-outline"></i></label>
							<input type="password" name="confirmPassword" id="re_pass"
								placeholder="Repeat your password" />
						</div>
						<div class="form-group">
							<input type="checkbox" name="agree-term" id="agree-term"
								class="agree-term" /> <label for="agree-term"
								class="label-agree-term"><span><span></span></span>I
								agree all statements in <a href="#" class="term-service">Terms
									of service</a></label>
						</div>
						<div class="form-group form-button">
							<input type="submit" name="signup" id="signup"
								class="form-submit" value="Register" />
						</div>
					</form>
				</div>
				<div class="signup-image">
					<figure>
						<img src="images/signup-image.jpg" alt="sing up image">
					</figure>
					<a href="/login" class="signup-image-link">Already have an
						account, Login!</a>
				</div>
			</div>
		</div>
	</section>

</body>
</html>
