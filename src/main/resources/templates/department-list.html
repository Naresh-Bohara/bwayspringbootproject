<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Department List</title>

</head>

<body class="bg-light">

<th:block th:insert="header.html"></th:block>

	<div class="container mt-5">

		<div class="card shadow">

			<div
				class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
				<h4 class="mb-0">Department List</h4>

				<a href="/department" class="btn btn-success"> + Add Department
				</a>
			</div>

			<div class="card-body">

				<table
					class="table table-striped table-hover table-bordered align-middle text-center">

					<thead class="">
						<tr>
							<th>S.N.</th>
							<th>Department Name</th>
							<th>Department Head</th>
							<th>Phone</th>
							<th width="180">Action</th>
						</tr>
					</thead>

					<tbody>

						<tr th:each="d, str : ${dlist}">
							<td>[[${str.count}]]</td>
							<td>[[${d.dptName}]]</td>
							<td>[[${d.dptHead}]]</td>
							<td>[[${d.dptPhone}]]</td>

							<td><a th:href="@{/dept/edit(id=${d.id})}"
								class="btn btn-info btn-sm"> Edit </a> <a
								th:href="@{/dept/delete(id=${d.id})}"
								class="btn btn-danger btn-sm"
								onclick="return confirm('Are you sure you want to delete this department?')">
									Delete </a></td>
						</tr>

					</tbody>

				</table>

			</div>

			<div class="card-footer text-center bg-warning">© 2026
				Department Management System</div>

		</div>

	</div>

</body>
</html>
