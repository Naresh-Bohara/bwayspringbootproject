<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile</title>

<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

	<!-- Navbar -->
	<div th:replace="~{header :: header}"></div>


	<!-- Profile -->
	<div class="container mt-5 mb-5">

		<div class="card shadow">

			<!-- Card Header -->
			<div class="card-header bg-primary text-white text-center">

				<h4 class="mb-0">
					<i class="fa-solid fa-user me-2"></i> My Profile
				</h4>

			</div>


			<!-- Card Body -->
			<div class="card-body">

				<!-- Profile Icon -->
				<div class="text-center mb-4">

					<div
						class="rounded-circle bg-primary text-white
                                d-inline-flex align-items-center
                                justify-content-center"
						style="width: 110px; height: 110px; font-size: 45px;">

						<i class="fa-solid fa-user"></i>

					</div>


					<!-- Full Name -->
					<h3 class="mt-3"
						th:text="${session.activeUser.fname + ' ' + session.activeUser.lname}">
					</h3>


					<!-- Username -->
					<p class="text-muted"
						th:text="'@' + ${session.activeUser.username}"></p>

				</div>


				<hr>


				<!-- User Information -->
				<div class="row mt-4">


					<!-- User ID -->
					<div class="col-md-6 mb-4">

						<label class="form-label fw-bold"> <i
							class="fa-solid fa-id-card me-2"></i> User ID
						</label>

						<div class="form-control bg-light"
							th:text="${session.activeUser.id}"></div>

					</div>


					<!-- First Name -->
					<div class="col-md-6 mb-4">

						<label class="form-label fw-bold"> <i
							class="fa-solid fa-user me-2"></i> First Name
						</label>

						<div class="form-control bg-light"
							th:text="${session.activeUser.fname}"></div>

					</div>


					<!-- Last Name -->
					<div class="col-md-6 mb-4">

						<label class="form-label fw-bold"> <i
							class="fa-solid fa-user me-2"></i> Last Name
						</label>

						<div class="form-control bg-light"
							th:text="${session.activeUser.lname}"></div>

					</div>
					<!-- Username -->
					<div class="col-md-6 mb-4">

						<label class="form-label fw-bold"> <i
							class="fa-solid fa-at me-2"></i> Username
						</label>

						<div class="form-control bg-light"
							th:text="${session.activeUser.username}"></div>

					</div>

				</div>


				<!-- Buttons -->
				<div class="text-center mt-3">

					<a href="/home" class="btn btn-secondary me-2"> <i
						class="fa-solid fa-house me-1"></i> Home

					</a> <a href="/logout" class="btn btn-danger"> <i
						class="fa-solid fa-right-from-bracket me-1"></i> Logout

					</a>

				</div>

			</div>


			<!-- Footer -->
			<div class="card-footer bg-warning text-center">@copyright2026

			</div>

		</div>

	</div>


	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
