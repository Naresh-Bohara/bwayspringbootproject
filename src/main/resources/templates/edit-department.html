<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Edit Department</title>
</head>
<body>

<th:block th:insert="header.html"></th:block>
	<hr>
	<div class="container-fluid">
		<div class="card">
			<div class="card-header bg-primary text-center text-white">
				<h4> Edit Department</h4>
			</div>
			<div class="card-body ">
				<form action="/dept/update" method="post" th:object="${deptObject}">
				<div class="row p-2">
					<div class="col-4">Department Name</div>
					<div class="col-6">
						<input type="text" th:field="*{dptName}"
							placeholder="Enter Department Name" class="form-control">
					</div>
				</div>

				<div class="row p-2">
					<div class="col-4">Department Phone</div>
					<div class="col-6">
						<input type="text" th:field="*{dptPhone}"
							placeholder="Enter Department Phone" class="form-control">
					</div>
				</div>

				<div class="row p-2">
					<div class="col-4">Department Head(HOD)</div>
					<div class="col-6">
						<input type="text" th:field="*{dptHead}"
							placeholder="Enter Department Head" class="form-control">
					</div>
				</div>

				<div class="row p-2">
					<div class="col-4"></div>
					<div class="col-6">

						<input type="submit" value="Update Department"
							class="btn btn-success btn-lg">
					</div>
				</div>
				<input type="hidden" th:field="*{id}">
				</form>


			</div>
			<div class="card-footer bg-warning text-center">@copyright2026</div>
		</div>
	</div>
</body>
</html>
